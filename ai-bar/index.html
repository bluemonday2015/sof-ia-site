.board::before{content:"";position:absolute;inset:0;background:rgba(10,8,6,0);transition:background .6s;pointer-events:none}
.board:has(.poster:hover)::before,.board:has(.poster:focus-visible)::before{background:rgba(10,8,6,.45)}
.poster{position:absolute;display:block;color:var(--ink);text-decoration:none;
 background-image:inherit;background-size:var(--bw) var(--bh);background-position:var(--bx) var(--by);
 opacity:0;z-index:2;transform-style:preserve-3d;
 transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1);
 transition:opacity .35s, transform .5s cubic-bezier(.2,.8,.2,1), filter .5s}
.poster::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
 background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,214,150,.35),transparent 55%),
 linear-gradient(115deg,transparent 35%,rgba(255,236,200,.28) 48%,transparent 60%);
 background-size:100% 100%,250% 100%;background-position:0 0,120% 0;mix-blend-mode:screen}
.poster:hover,.poster:focus-visible{opacity:1;z-index:3;
 transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.07);
 filter:drop-shadow(0 18px 28px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(240,184,101,.25));
 animation:flick .7s steps(1,end) both}
.poster:hover::after,.poster:focus-visible::after{opacity:1;animation:sheen 1.1s ease-out .15s both}
@keyframes flick{0%{filter:brightness(.4)}12%{filter:brightness(1.2)}20%{filter:brightness(.6)}32%,100%{filter:brightness(1.1) saturate(1.08) drop-shadow(0 18px 28px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(240,184,101,.25))}}
@keyframes sheen{from{background-position:0 0,120% 0}to{background-position:0 0,-120% 0}}
.poster:focus-visible{outline:none}
.cap{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);width:max-content;max-width:18rem;
 background:rgba(18,15,13,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:.45rem .8rem;border-radius:3px;text-align:center;opacity:0;transition:opacity .4s, transform .4s;pointer-events:none}
.poster.up .cap{top:auto;bottom:100%;transform:translate(-50%,-8px)}
.cap b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.1rem;line-height:1.15;letter-spacing:.005em}
.cap span{display:block;margin-top:.3rem;font-size:.55rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.poster:hover .cap,.poster:focus-visible .cap{opacity:1}
.note{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);transform:translateX(-50%);
 font-size:.9rem;opacity:.6;pointer-events:none;text-shadow:0 1px 6px #000}
@media (hover:none){.poster{opacity:0}.poster:active{opacity:1}}
@media (max-aspect-ratio:1/1){.scroller{justify-content:flex-start}.board{width:auto;height:100vh}}
@media (prefers-reduced-motion:reduce){.poster,.cap,.board::before{transition:none;animation:none!important}.poster::after{animation:none!important}}
.home{position:fixed;top:calc(env(safe-area-inset-top,0px) + 1.1rem);left:1.3rem;z-index:10;
 display:inline-flex;align-items:baseline;gap:.4em;color:var(--ink);text-decoration:none;
 opacity:.85;text-shadow:0 1px 6px #000;transition:opacity .3s}
.home:hover,.home:focus-visible{opacity:1}
.home .arrow{font-size:1.1rem;transition:transform .3s}
.home:hover .arrow{transform:translateX(-3px)}
.home .passage{font-family:"Newsreader","Cormorant Garamond",Georgia,serif;font-weight:400;
 font-size:1.5rem;line-height:1;letter-spacing:-0.025em;display:inline-flex;align-items:baseline;white-space:nowrap}
.home .passage .sof{font-style:normal}
.home .passage .ia{font-style:italic}
.home .passage .gate{display:inline-block;position:relative;width:.01em;height:.66em;
 background:var(--amber);margin-left:.30em;margin-right:.16em;transform:translateY(.04em)}
.home .passage .gate::before,.home .passage .gate::after{content:"";position:absolute;left:50%;
 width:.10em;height:.012em;background:var(--amber);transform:translateX(-50%)}
.home .passage .gate::before{top:calc(-0.012em + 0.003em)}
.home .passage .gate::after{bottom:calc(-0.012em + 0.003em)}
</style></head><body>
<a class="home" href="../" aria-label="Sof-IA — back to home"><span class="arrow" aria-hidden="true">&larr;</span><span class="passage"><span class="sof">Sof</span><span class="gate" aria-hidden="true"></span><span class="ia">IA</span></span></a>
<div class="scroller"><div class="board" id="board" role="navigation" aria-label="The AI Bar episodes"></div></div>
<p class="note">Choose a poster</p>
<script>
const eps=[
 {t:"Masquerade in the Uncanny Valley",s:"Season 1 · Episode 2",r:[31.1,20.7,23.3,34.5],up:true,url:"https://www.youtube.com/watch?v=nCuJvwWy_Fw"},
 {t:"AI Beyond Benchmarks",s:"Season 1 · Episode 1",r:[55.6,15.9,34.1,28.2],up:false,url:"https://www.youtube.com/watch?v=lWMLjDygk5c"},
 {t:"We Are in the Asylum",s:"Season 1 · Episode 3 (Part 1)",r:[30.5,55.3,23.9,30.8],up:true,url:"https://www.youtube.com/watch?v=x84zyFX9By8"},
 {t:"Petits Rêves, Grands Départs",s:"Season 2 · A radio opera",r:[55.6,44.5,35.3,43.7],up:true,url:"https://www.youtube.com/watch?v=lUY2MoSnBzc"}
];
const b=document.getElementById('board');
eps.forEach(e=>{
  const [x,y,w,h]=e.r,a=document.createElement('a');
  a.className='poster'+(e.up?' up':'');
  a.href=e.url||('https://www.youtube.com/results?search_query='+encodeURIComponent('The AI Bar '+e.t));
  a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',e.t+', '+e.s+'. Opens on YouTube');
  Object.assign(a.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});
  a.style.setProperty('--bw',(100/w*100)+'%');a.style.setProperty('--bh',(100/h*100)+'%');
  a.style.setProperty('--bx',(x/(100-w)*100)+'%');a.style.setProperty('--by',(y/(100-h)*100)+'%');
  a.innerHTML=`<span class="cap"><b>${e.t}</b><span>${e.s}</span></span>`;
  b.appendChild(a);
});

document.querySelectorAll('.poster').forEach(p=>{
 p.addEventListener('pointermove',ev=>{const r=p.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;
  p.style.setProperty('--ry',((x-.5)*10)+'deg');p.style.setProperty('--rx',((.5-y)*8)+'deg');
  p.style.setProperty('--mx',(x*100)+'%');p.style.setProperty('--my',(y*100)+'%');});
 p.addEventListener('pointerleave',()=>{p.style.setProperty('--rx','0deg');p.style.setProperty('--ry','0deg');});
});
</script></body></html>
